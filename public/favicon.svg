<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1218"/>
      <stop offset="50%" stop-color="#14202a"/>
      <stop offset="100%" stop-color="#080d12"/>
    </linearGradient>
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="35%" stop-color="#2f5bff"/>
      <stop offset="70%" stop-color="#d49a00"/>
      <stop offset="100%" stop-color="#0c8c78"/>
    </linearGradient>
    <linearGradient id="bugGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="45%" stop-color="#0c8c78"/>
      <stop offset="85%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ffd166"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Base Squircle -->
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#bgGrad)"/>
  <rect x="24" y="24" width="464" height="464" rx="112" fill="none" stroke="url(#rimGrad)" stroke-width="12" stroke-opacity="0.9"/>

  <!-- Radar / Target rings in subtle background -->
  <circle cx="256" cy="265" r="170" fill="none" stroke="#00f2fe" stroke-width="2.5" stroke-dasharray="10 14" stroke-opacity="0.25"/>
  <circle cx="256" cy="265" r="110" fill="none" stroke="#0c8c78" stroke-width="2" stroke-opacity="0.2"/>

  <!-- Target Crosshairs Ticks -->
  <line x1="256" y1="78" x2="256" y2="104" stroke="#00f2fe" stroke-width="6" stroke-linecap="round" stroke-opacity="0.8"/>
  <line x1="256" y1="426" x2="256" y2="452" stroke="#f59e0b" stroke-width="6" stroke-linecap="round" stroke-opacity="0.8"/>
  <line x1="68" y1="265" x2="94" y2="265" stroke="#00f2fe" stroke-width="6" stroke-linecap="round" stroke-opacity="0.8"/>
  <line x1="418" y1="265" x2="444" y2="265" stroke="#f59e0b" stroke-width="6" stroke-linecap="round" stroke-opacity="0.8"/>

  <!-- Cyber Bug Main Emblem -->
  <g id="bug" filter="url(#glow)">
    <!-- Antennae -->
    <path d="M228 178 Q195 125 155 116" fill="none" stroke="url(#bugGrad)" stroke-width="14" stroke-linecap="round"/>
    <circle cx="150" cy="115" r="10" fill="#00f2fe"/>
    
    <path d="M284 178 Q317 125 357 116" fill="none" stroke="url(#bugGrad)" stroke-width="14" stroke-linecap="round"/>
    <circle cx="362" cy="115" r="10" fill="#00f2fe"/>

    <!-- Legs Left -->
    <path d="M185 225 L120 195 L95 215" fill="none" stroke="url(#bugGrad)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M175 275 L105 275 L80 305" fill="none" stroke="url(#bugGrad)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M185 330 L115 355 L95 400" fill="none" stroke="url(#bugGrad)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Legs Right -->
    <path d="M327 225 L392 195 L417 215" fill="none" stroke="url(#bugGrad)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M337 275 L407 275 L432 305" fill="none" stroke="url(#bugGrad)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M327 330 L397 355 L417 400" fill="none" stroke="url(#bugGrad)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Bug Head -->
    <path d="M205 186 C205 152 230 144 256 144 C282 144 307 152 307 186 Z" fill="url(#bugGrad)"/>
    
    <!-- Shield / Body Upper Thorax -->
    <path d="M190 204 C190 196 200 194 256 194 C312 194 322 196 322 204 C322 232 308 244 256 244 C204 244 190 232 190 204 Z" fill="url(#bugGrad)"/>

    <!-- Abdomen / Elytra with Center Seam Split -->
    <!-- Left Wing/Shell -->
    <path d="M192 256 C180 286 182 340 220 375 C244 397 251 405 251 405 L251 256 Z" fill="url(#bugGrad)"/>
    <!-- Right Wing/Shell -->
    <path d="M320 256 C332 286 330 340 292 375 C268 397 261 405 261 405 L261 256 Z" fill="url(#bugGrad)"/>

    <!-- Central Glowing Core / Target Eye -->
    <circle cx="256" cy="275" r="16" fill="#0b1218" stroke="#00f2fe" stroke-width="5"/>
    <circle cx="256" cy="275" r="6" fill="#ffd166"/>
  </g>
</svg>
